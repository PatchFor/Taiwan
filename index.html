<style>
  :root{
    --bg:#F5F1EA;
    --card:#FFFFFF;
    --card-glass:rgba(255,255,255,0.88);
    --jade:#1D8E7F;
    --jade-dark:#167A6D;
    --jade-soft:rgba(29,142,127,0.07);
    --jade-glow:rgba(29,142,127,0.12);
    --vermillion:#C94D32;
    --vermillion-soft:rgba(201,77,50,0.06);
    --gold:#B8975A;
    --gold-soft:rgba(184,151,90,0.07);
    --ink:#2D3134;
    --muted:#87857E;
    --border:#E5DFD5;
    --surface:rgba(45,49,52,0.03);
    --shadow:0 2px 8px rgba(45,49,52,0.06);
    --shadow-lg:0 8px 24px rgba(45,49,52,0.1);
    --shadow-sm:0 1px 3px rgba(45,49,52,0.04);
    --radius:10px;
    --radius-lg:14px;
    --transition:0.2s ease;
    --hero-top:#EEEBE3;
  }

  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1A1E22;--card:#242930;--card-glass:rgba(36,41,48,0.92);
      --jade:#40C4AD;--jade-dark:#5DD4BD;--jade-soft:rgba(64,196,173,0.08);--jade-glow:rgba(64,196,173,0.14);
      --vermillion:#E06B52;--vermillion-soft:rgba(224,107,82,0.08);
      --gold:#D1AD64;--gold-soft:rgba(209,173,100,0.08);
      --ink:#E2DDD5;--muted:#8A8681;--border:#353B42;--surface:rgba(255,255,255,0.03);
      --shadow:0 2px 8px rgba(0,0,0,0.2);--shadow-lg:0 8px 24px rgba(0,0,0,0.3);--shadow-sm:0 1px 3px rgba(0,0,0,0.15);
      --hero-top:#22272D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1E22;--card:#242930;--card-glass:rgba(36,41,48,0.92);
    --jade:#40C4AD;--jade-dark:#5DD4BD;--jade-soft:rgba(64,196,173,0.08);--jade-glow:rgba(64,196,173,0.14);
    --vermillion:#E06B52;--vermillion-soft:rgba(224,107,82,0.08);
    --gold:#D1AD64;--gold-soft:rgba(209,173,100,0.08);
    --ink:#E2DDD5;--muted:#8A8681;--border:#353B42;--surface:rgba(255,255,255,0.03);
    --shadow:0 2px 8px rgba(0,0,0,0.2);--shadow-lg:0 8px 24px rgba(0,0,0,0.3);--shadow-sm:0 1px 3px rgba(0,0,0,0.15);
    --hero-top:#22272D;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{overflow-x:hidden;width:100%;scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;width:100%;
    transition:background var(--transition),color var(--transition);
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px;}
  h1,h2,h3,h4{font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em;text-wrap:balance;}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}

  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:60;
    width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);
    box-shadow:var(--shadow-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    transition:transform var(--transition),box-shadow var(--transition);
  }
  .theme-toggle:hover{transform:scale(1.08);box-shadow:var(--shadow);}

  header.hero{
    position:relative;
    padding:40px 20px 28px;text-align:center;
    background:linear-gradient(180deg,var(--hero-top) 0%,var(--bg) 100%);
    border-bottom:2px solid var(--jade);
    transition:background var(--transition),border-color var(--transition);
  }
  .hero-inner{position:relative;z-index:1;}
  .eyebrow{
    font-size:11px;font-weight:700;color:var(--jade);
    letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;
  }
  h1.title{
    font-weight:800;font-size:clamp(28px,5vw,46px);
    margin:0 0 6px;color:var(--ink);line-height:1.15;
  }
  .subtitle{
    font-size:14px;color:var(--muted);
    max-width:440px;margin:0 auto 14px;line-height:1.55;
  }
  .countdown-bar{
    display:inline-flex;gap:3px;border-radius:8px;overflow:hidden;margin-top:6px;
  }
  .cd-item{background:#1D2228;padding:8px 14px;text-align:center;min-width:52px;}
  .cd-num{font-size:22px;font-weight:800;color:#40C4AD;font-variant-numeric:tabular-nums;line-height:1.15;}
  .cd-label{font-size:9px;color:rgba(226,221,213,0.45);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;}

  .day-rail-wrap{
    position:sticky;top:0;z-index:50;
    background:var(--bg);border-bottom:1px solid var(--border);
    transition:background var(--transition),box-shadow var(--transition);
  }
  .day-rail-wrap.scrolled{
    background:var(--card-glass);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 1px 8px rgba(0,0,0,0.05);
  }
  .day-rail{
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;
    max-width:1140px;margin:0 auto;padding:0 20px;
  }
  .day-pill{
    padding:10px 8px;cursor:pointer;
    border-bottom:3px solid transparent;
    transition:border-color var(--transition),background var(--transition);
    text-align:center;min-width:0;
  }
  .day-pill:hover{background:var(--jade-soft);}
  .day-pill.active{border-bottom-color:var(--jade);background:var(--jade-soft);}
  .day-pill .pill-top{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
  .day-pill .num{
    background:var(--jade);color:#fff;font-weight:700;
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    transition:background var(--transition);
  }
  .day-pill.active .num{background:var(--jade-dark);}
  .day-pill .date{font-size:11px;color:var(--muted);font-weight:600;}
  .pill-emoji{font-size:18px;line-height:1;}
  .day-pill .route{font-size:11px;color:var(--ink);line-height:1.35;overflow-wrap:break-word;opacity:0.7;}

  .section-title{display:flex;align-items:center;gap:10px;margin:24px 0 16px;flex-wrap:wrap;}
  .section-title h2{font-size:22px;margin:0;color:var(--ink);line-height:1.35;}

  .grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:20px;align-items:start;}
  @media(max-width:860px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card);border-radius:var(--radius-lg);
    border:1px solid var(--border);overflow:hidden;
    transition:background var(--transition),border-color var(--transition);
  }

  .timeline-card{padding:6px 4px 16px;}
  .card-head{display:flex;align-items:center;gap:8px;padding:16px 20px 8px;font-weight:700;color:var(--ink);font-size:14px;}
  .tl-list{padding:0 12px;display:flex;flex-direction:column;gap:6px;}
  .tl-item{
    display:flex;gap:14px;padding:11px 14px;border-radius:8px;
    background:transparent;transition:background var(--transition);
    border:1px solid transparent;
  }
  .tl-item:hover{background:var(--surface);}
  .tl-item.tl-stop{
    background:var(--vermillion-soft);
    border-left:3px solid var(--vermillion);
    border-radius:0 8px 8px 0;
  }
  .tl-time-col{flex:0 0 68px;}
  .tl-time{font-weight:700;color:var(--ink);font-size:13px;line-height:1.3;font-variant-numeric:tabular-nums;}
  .tl-dur{display:block;font-weight:600;font-size:10px;color:var(--muted);margin-top:2px;}
  .tl-main{flex:1;min-width:0;}
  .tl-activity{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.5;margin-bottom:6px;overflow-wrap:break-word;word-break:break-word;}
  .tl-activity a{overflow-wrap:break-word;word-break:break-word;color:var(--jade-dark);font-weight:700;}
  .tl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tl-transport{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11.5px;color:var(--jade-dark);font-weight:600;
    overflow-wrap:anywhere;max-width:100%;
  }
  .tl-loc-link{
    text-decoration:none;display:inline-flex;align-items:center;gap:3px;
    max-width:200px;overflow:hidden;
    font-size:11px;color:var(--jade-dark);font-weight:700;
    background:var(--jade-soft);padding:3px 9px;border-radius:12px;
    white-space:nowrap;text-overflow:ellipsis;transition:transform 0.12s ease;
  }
  .tl-loc-link .loc-text{overflow:hidden;text-overflow:ellipsis;}
  .tl-loc-link:hover{transform:translateY(-1px);text-decoration:underline;}
  @media(max-width:480px){
    .tl-item{flex-direction:column;gap:6px;}
    .tl-time-col{flex:none;display:flex;align-items:baseline;gap:6px;}
    .tl-dur{margin-top:0;}
  }

  .sched-btn{
    display:inline-flex;align-items:center;gap:4px;
    font-family:inherit;font-size:11.5px;font-weight:700;
    color:var(--ink);background:var(--card);
    border:1.5px solid var(--border);padding:3px 10px;border-radius:14px;
    cursor:pointer;overflow-wrap:anywhere;max-width:100%;
    transition:background var(--transition);
  }
  .sched-btn:hover{background:var(--surface);}
  .sched-btn .caret{transition:transform 0.15s ease;font-size:10px;}
  .sched-btn.open .caret{transform:rotate(180deg);}
  .sched-detail{
    background:var(--gold-soft);border-radius:8px;
    padding:11px 14px;font-size:12px;color:var(--ink);line-height:1.6;margin-top:8px;
  }
  .sched-detail .sd-take{color:var(--jade-dark);font-weight:700;}
  .sched-detail .sd-next{color:var(--ink);font-weight:700;}
  .sched-detail a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:2px;}

  .info-btn{
    display:inline-flex;align-items:center;gap:4px;
    font-family:inherit;font-size:11.5px;font-weight:700;
    color:var(--jade-dark);background:var(--card);
    border:1.5px solid var(--jade);padding:3px 10px;border-radius:14px;
    cursor:pointer;overflow-wrap:anywhere;max-width:100%;
    transition:background var(--transition);
  }
  .info-btn:hover{background:var(--jade-soft);}
  .info-btn .caret{transition:transform 0.15s ease;font-size:10px;}
  .info-btn.open .caret{transform:rotate(180deg);}
  .info-detail{
    background:var(--jade-soft);border-radius:8px;
    padding:12px 14px;font-size:12px;color:var(--ink);line-height:1.65;margin-top:8px;
    animation:slideDown 0.2s ease;
  }
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .info-detail h5{margin:0 0 4px;font-size:12.5px;color:var(--jade-dark);}
  .info-detail ul{margin:0 0 8px;padding-left:16px;}
  .info-detail ul:last-child{margin-bottom:0;}
  .info-detail a{color:var(--jade-dark);font-weight:700;text-decoration:underline;text-underline-offset:2px;}

  .notes-card{margin-top:20px;padding:18px 20px;}
  .notes-card ul{margin:0;padding-left:18px;}
  .notes-card li{margin-bottom:6px;font-size:12.5px;line-height:1.6;color:var(--ink);}
  .notes-card li:last-child{margin-bottom:0;}

  .expense-card{padding:6px 4px 18px;}
  .expense-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 12px;}
  .expense-form input,.expense-form select{
    font-family:inherit;font-size:13px;padding:9px 12px;border-radius:8px;
    border:1.5px solid var(--border);background:var(--card);color:var(--ink);outline:none;
    transition:border-color var(--transition);
  }
  .expense-form input:focus,.expense-form select:focus{border-color:var(--jade);}
  .expense-form input#expItem{grid-column:1 / -1;}
  .expense-submit-btn{
    grid-column:1 / -1;font-family:inherit;font-size:13px;font-weight:700;
    color:#fff;background:var(--jade);border:none;border-radius:8px;
    padding:11px 12px;cursor:pointer;transition:transform 0.12s ease,opacity 0.12s ease;
  }
  .expense-submit-btn:hover{transform:translateY(-1px);}
  .expense-list{padding:0 20px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .expense-empty{font-size:12px;color:var(--muted);background:var(--surface);border-radius:8px;padding:12px;text-align:center;}
  .expense-row{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:8px;padding:9px 12px;}
  .exp-name{font-weight:700;font-size:12px;color:var(--ink);flex:0 0 44px;}
  .exp-item{flex:1;color:var(--ink);font-size:12.5px;}
  .exp-amount{font-weight:700;font-size:12.5px;color:var(--jade-dark);white-space:nowrap;}
  .exp-payment{font-size:10.5px;color:var(--muted);flex:0 0 auto;}
  .exp-del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;border-radius:8px;}
  .exp-del:hover{background:var(--vermillion-soft);color:var(--vermillion);}
  .expense-status{grid-column:1 / -1;font-size:12px;font-weight:700;min-height:14px;}
  .expense-status.is-ok{color:var(--jade-dark);}
  .expense-status.is-error{color:#dc2626;}
  .fallback-note{margin:10px 20px 0;background:var(--gold-soft);color:var(--muted);border-radius:8px;padding:9px 12px;font-size:11px;line-height:1.5;}
  .today-summary{margin:12px 20px 0;background:var(--gold-soft);border-radius:8px;padding:10px 14px;}
  .today-summary-title{font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:4px;}
  .today-summary-total{font-weight:700;font-size:13.5px;color:var(--jade-dark);}

  .report-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.4);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    z-index:100;display:flex;align-items:center;justify-content:center;
    padding:20px;animation:fadeIn 0.2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

function getEffectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr === 'dark') return 'dark';
  if(attr === 'light') return 'light';
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function initTheme(){
  const saved = localStorage.getItem('theme');
  if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else if(saved === 'light') document.documentElement.setAttribute('data-theme','light');
  updateThemeIcon();
}
function toggleTheme(){
  if(getEffectiveTheme() === 'dark'){
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('theme','light');
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    localStorage.setItem('theme','dark');
  }
  updateThemeIcon();
}
function updateThemeIcon(){
  document.getElementById('themeToggle').textContent = getEffectiveTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
initTheme();

function updateCountdown(){
  const target = new Date('2026-10-14T04:30:00+07:00');
  const now = new Date();
  const diff = target - now;
  if(diff <= 0){
    document.getElementById('countdown').innerHTML = '<div class="cd-item" style="min-width:auto;padding:8px 18px;border-radius:8px;"><div class="cd-num" style="font-size:15px;">🎉 เที่ยวให้สนุกนะ!</div></div>';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('cdDays').textContent = d;
  document.getElementById('cdHrs').textContent = String(h).padStart(2,'0');
  document.getElementById('cdMin').textContent = String(m).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

function updateCurrency(){
  const val = parseFloat(document.getElementById('currencyInput').value) || 0;

function formatDurationOnly(timeStr){
  const parts = timeStr.split('–');
  if(parts.length !== 2) return '';
  const toMin = t => { const hm = t.trim().split(':').map(Number); return hm[0]*60+hm[1]; };
  let s = toMin(parts[0]), e = toMin(parts[1]);
  if(e < s) e += 1440;
  const diff = e - s;
  const durText = diff >= 60 ? Math.floor(diff/60) + '.' + String(diff%60).padStart(2,'0') + ' hrs' : diff + ' min';
  return '<span class="tl-dur">(' + durText + ')</span>';
}

function renderMap(day){

    const stop = document.createElement('div');

const memoryStore = {};
let usingStorageFallback = false;

async function loadDayExpenses(dayNumber){
  const key = `expenses_day_${dayNumber}`;
  if(!window.storage || typeof window.storage.get !== 'function'){
    usingStorageFallback = true;
    return memoryStore[key] ? JSON.parse(memoryStore[key]) : [];
  }
  const res = await window.storage.get(key, true);
  return res && res.value ? JSON.parse(res.value) : [];
}
async function saveDayExpenses(dayNumber, list){
  const key = `expenses_day_${dayNumber}`;
  if(!window.storage || typeof window.storage.set !== 'function'){
    usingStorageFallback = true;
    memoryStore[key] = JSON.stringify(list);
    return { key, value: memoryStore[key], shared: false };
  }
  const result = await window.storage.set(key, JSON.stringify(list), true);
  if(!result) throw new Error('Storage write returned no result');
  return result;
}

function expenseRowsHtml(list){

}

async function renderReportEntrySection(dayNumber){
  const section = document.getElementById('reportEntrySection');
  section.innerHTML = `<div class="expense-empty">กำลังโหลด...</div>`;
  let list = [], loadError = null;
  try { list = await loadDayExpenses(dayNumber); } catch(e) { loadError = e; }

  section.innerHTML = `
    <div class="report-day-tabs">${tripData.map(d => `<button type="button" class="report-day-tab${d.dayNumber === dayNumber ? ' active' : ''}" data-day="${d.dayNumber}">Day ${d.dayNumber}</button>`).join('')}</div>
    ${loadError ? `<div style="background:var(--vermillion-soft);color:var(--vermillion);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:8px;">⚠️ ${loadError.message||loadError}</div>` : ''}
    <form id="expenseForm" class="expense-form">
      <select id="expName" required><option value="" disabled selected>Name</option>${PEOPLE.map(p => `<option value="${p}">${p}</option>`).join('')}</select>
      <input type="text" id="expItem" placeholder="Item (รายการ)" required>
      <input type="number" id="expAmount" placeholder="Amount (NTD)" required min="0" step="1">
      <select id="expPayment" required><option value="" disabled selected>Payment</option><option value="เงินสด">เงินสด</option><option value="บัตร AM">บัตร AM</option><option value="บัตร For">บัตร For</option><option value="บัตร Arm">บัตร Arm</option><option value="โอนเงิน">โอนเงิน</option></select>
      <button type="submit" class="expense-submit-btn">✅ เพิ่มรายการ</button>
      <div id="expenseStatus" class="expense-status"></div>
    </form>
    <div id="expenseList" class="expense-list">${expenseRowsHtml(list)}</div>
    <div id="todaySummary" class="today-summary" style="display:none"></div>
    ${usingStorageFallback ? `<div class="fallback-note">ℹ️ ข้อมูลอยู่แค่ในแท็บนี้ แนะนำ Export Excel เก็บไว้เป็นระยะ</div>` : ''}
  `;

  document.querySelectorAll('.report-day-tab').forEach(tab => {
    tab.addEventListener('click', () => { reportActiveDay = Number(tab.dataset.day); renderReportEntrySection(reportActiveDay); });
  });

  const refreshList = () => { document.getElementById('expenseList').innerHTML = expenseRowsHtml(list); renderTodaySummary(list, dayNumber); };
  const setStatus = (msg, isErr) => {
    const el = document.getElementById('expenseStatus');
    el.textContent = msg; el.className = 'expense-status' + (isErr ? ' is-error' : ' is-ok');
    if(!isErr) setTimeout(() => { if(el) { el.textContent=''; el.className='expense-status'; } }, 2500);
  };
  const persist = async () => {
    try { await saveDayExpenses(dayNumber, list); setStatus('✅ บันทึกแล้ว', false); }
    catch(err) { setStatus('⚠️ ' + (err.message||err), true); }
  };

  document.getElementById('expenseForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const name = document.getElementById('expName').value;
    const item = document.getElementById('expItem').value.trim();
    const amount = parseFloat(document.getElementById('expAmount').value);
    const payment = document.getElementById('expPayment').value;
    if(!name || !item || !amount || !payment) return;
    list.push({ name, item, amount, payment });
    refreshList(); ev.target.reset(); persist();
  });
  document.getElementById('expenseList').addEventListener('click', ev => {
    const btn = ev.target.closest('.exp-del');
    if(!btn) return;
    list.splice(Number(btn.dataset.idx), 1);
    refreshList(); persist();
  });
  renderTodaySummary(list, dayNumber);
}

async function renderReportSummary(){
  const section = document.getElementById('reportSummarySection');
  let allLists;
  try { allLists = await Promise.all(tripData.map(d => loadDayExpenses(d.dayNumber))); }
  catch(err) { section.innerHTML = `<div class="expense-empty">⚠️ ${err.message||err}</div>`; return; }

  const dayTotals = allLists.map(l => l.reduce((s, e) => s + Number(e.amount||0), 0));
  const grandTotal = dayTotals.reduce((s, t) => s + t, 0);
  const perShare = grandTotal / PEOPLE.length;
  const paidByPerson = {};
  PEOPLE.forEach(p => paidByPerson[p] = 0);
  allLists.flat().forEach(e => { paidByPerson[e.name] = (paidByPerson[e.name]||0) + Number(e.amount||0); });
  const maxPaid = Math.max(perShare, ...Object.values(paidByPerson), 1);

  let html = `<div class="report-daybreakdown">`;
  html += tripData.map((d, i) => {
    const byP = {}; allLists[i].forEach(e => { byP[e.name] = (byP[e.name]||0) + Number(e.amount||0); });
    const pLine = Object.keys(byP).length ? Object.keys(byP).map(n => `${n} จ่าย ${byP[n].toLocaleString()}`).join(' · ') : 'ยังไม่มีรายการ';
    return `<div class="report-day-row"><span>${d.emoji||''} Day ${d.dayNumber} <span class="report-day-date">(${d.dateLabel})</span></span><span>${dayTotals[i].toLocaleString()} NT$</span></div><div class="report-day-subline">${pLine}</div>`;
  }).join('');
  html += `</div>`;
  html += `<div class="report-total-row"><span>รวมทั้งทริป</span><span>${grandTotal.toLocaleString()} NT$</span></div>`;
  html += `<div class="report-split-row"><span>หาร ${PEOPLE.length} คน คนละ</span><span>${perShare.toLocaleString(undefined,{maximumFractionDigits:0})} NT$</span></div>`;

  html += `<div class="report-people-grid">` + Object.keys(paidByPerson).map(name => {
    const paid = paidByPerson[name];
    const diff = paid - perShare;
    const barPct = Math.min(100, (paid / maxPaid) * 100);
    const diffText = diff >= 0
      ? `<span class="report-diff-get">✅ ได้คืน ${diff.toLocaleString(undefined,{maximumFractionDigits:0})} NT$</span>`
      : `<span class="report-diff-owe">⚠️ ต้องจ่ายเพิ่ม ${Math.abs(diff).toLocaleString(undefined,{maximumFractionDigits:0})} NT$</span>`;
    return `<div class="report-person-card"><div class="report-person-name">${name}</div><div class="report-person-bar-track"><div class="report-person-bar ${diff >= 0 ? 'bar-get' : 'bar-owe'}" style="width:${barPct}%"></div></div><div class="report-person-line">จ่ายไปแล้ว ${paid.toLocaleString()} NT$</div><div class="report-person-diff">${diffText}</div></div>`;
  }).join('') + `</div>`;

  const balances = PEOPLE.map(name => ({ name, diff: paidByPerson[name] - perShare }));
  const creditors = balances.filter(b => b.diff > 0.5).sort((a,b) => b.diff - a.diff).map(b => ({...b}));
  const debtors = balances.filter(b => b.diff < -0.5).sort((a,b) => a.diff - b.diff).map(b => ({...b}));
  const transfers = [];
  let ci = 0, di = 0;
  while(ci < creditors.length && di < debtors.length){
    const amt = Math.min(creditors[ci].diff, -debtors[di].diff);
    if(amt > 0.5) transfers.push({ from: debtors[di].name, to: creditors[ci].name, amt });
    creditors[ci].diff -= amt; debtors[di].diff += amt;
    if(creditors[ci].diff < 0.5) ci++;
    if(debtors[di].diff > -0.5) di++;
  }

  html += `<div class="settlement-box"><div class="settlement-title">🧾 สรุปว่าใครต้องโอนให้ใคร</div>`;
  if(!transfers.length) html += `<div class="settlement-line">ยอดเท่ากันพอดี ไม่ต้องโอนเพิ่ม 🎉</div>`;
  else transfers.forEach(t => { html += `<div class="settlement-line">💸 <b>${t.from}</b> → <b>${t.to}</b> <b>${Math.round(t.amt).toLocaleString()} NT$</b></div>`; });
  html += `<div class="settlement-line settlement-summary-line">รวม <b>${grandTotal.toLocaleString()} NT$</b> · คนละ <b>${perShare.toLocaleString(undefined,{maximumFractionDigits:0})} NT$</b></div></div>`;
  section.innerHTML = html;
}

document.getElementById('exportExcelBtn').addEventListener('click', async () => {

  try { allLists = await Promise.all(tripData.map(d => loadDayExpenses(d.dayNumber))); }
  catch(err) { alert('โหลดข้อมูลไม่สำเร็จ: ' + (err.message||err)); return; }

  const money = n => Number(n) || 0;
  const txHeader = ['Day', 'Date', 'Name', 'Item', 'Amount (NT$)', 'Payment Method'];

  wsTx['!cols'] = [{ wch:8 },{ wch:16 },{ wch:10 },{ wch:24 },{ wch:14 },{ wch:14 }];

  const grandTotal = txRows.reduce((s, r) => s + r[4], 0);
  const perShare = grandTotal / PEOPLE.length;
  const paidByPerson = {}; PEOPLE.forEach(p => paidByPerson[p] = 0);
  txRows.forEach(r => { paidByPerson[r[2]] = (paidByPerson[r[2]]||0) + r[4]; });

  const aoa = [];
  aoa.push(['🧋 Taiwan Trip — สรุปค่าใช้จ่ายทั้งทริป']);
  aoa.push(['']);
  aoa.push(['วันที่', 'ยอดรวม (NT$)']);
  tripData.forEach((d, i) => { aoa.push([`${d.emoji||''} Day ${d.dayNumber} (${d.dateLabel})`, allLists[i].reduce((s, e) => s + money(e.amount), 0)]); });
  aoa.push(['']); aoa.push(['รวมทั้งทริป', grandTotal]); aoa.push([`หาร ${PEOPLE.length} คน คนละ`, Math.round(perShare)]);
  aoa.push(['']); aoa.push(['Name', 'จ่ายไปแล้ว (NT$)', 'ผลลัพธ์']);
  PEOPLE.forEach(p => {
    const diff = paidByPerson[p] - perShare;
    aoa.push([p, Math.round(paidByPerson[p]), diff >= 0 ? `ได้คืน ${Math.round(diff).toLocaleString()} NT$` : `ต้องจ่ายเพิ่ม ${Math.round(Math.abs(diff)).toLocaleString()} NT$`]);
  });

  const wsSummary = XLSX.utils.aoa_to_sheet(aoa);
  wsSummary['!cols'] = [{ wch:26 },{ wch:16 },{ wch:20 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
  XLSX.utils.book_append_sheet(wb, wsTx, 'Transactions');
  XLSX.writeFile(wb, 'taiwan-trip-expenses.xlsx');
});

try { initLeaflet(); } catch(e) { console.error('initLeaflet failed', e); }
try { renderAll(); } catch(e) { console.error('renderAll failed', e); }
</script>
